<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>favicon preview</title>
<style>
  body { margin: 0; background: #f4f1ec; font: 13px/1.2 sans-serif; color: #333; }
  .row { display: flex; align-items: flex-end; gap: 28px; padding: 28px; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  img { background: #fff; border: 1px solid #ccc; }
  .board { background: conic-gradient(#e7e2db 25%, #fff 0 50%, #e7e2db 0 75%, #fff 0) 0 0 / 16px 16px; padding: 20px; }
</style>
</head>
<body>
  <div class="row">
    <div class="cell"><img src="favicon.svg" width="16" height="16" alt="16"><span>16</span></div>
    <div class="cell"><img src="favicon.svg" width="32" height="32" alt="32"><span>32</span></div>
    <div class="cell"><img src="favicon.svg" width="64" height="64" alt="64"><span>64</span></div>
    <div class="cell board"><img src="favicon.svg" width="160" height="160" alt="160"></div>
  </div>
</body>
</html>
